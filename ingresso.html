<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Seu ingresso · Gang Corre Party</title>
<style>
  :root{--bg:#0a0c10;--surface:#12151c;--surface-2:#171b24;--line:#242a36;--text:#f4f6fa;--muted:#8b93a3;--accent:#4D8DFF;--ok:#38d39f;--err:#E8622C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.5}
  .box{width:min(420px,100%);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(56,211,159,.14);border:1px solid var(--ok);color:var(--ok);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 12px;border-radius:999px;margin-bottom:16px}
  .badge.used{background:rgba(232,98,44,.14);border-color:var(--err);color:var(--err)}
  h1{font-size:1.5rem;text-transform:uppercase;margin-bottom:4px}
  .name{font-size:1.05rem;color:var(--accent);font-weight:700;margin-bottom:2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .qr{background:#fff;border-radius:16px;padding:16px;width:220px;height:220px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}
  .qr svg{width:100%;height:100%}
  .info{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:.85rem;color:var(--muted);margin-bottom:16px}
  .info b{color:var(--text)}
  .btn{display:block;width:100%;background:var(--accent);color:#04122e;font-weight:800;text-decoration:none;padding:14px;border-radius:12px;text-transform:uppercase;font-size:.95rem;letter-spacing:.02em}
  .foot{margin-top:18px;font-size:.72rem;color:var(--muted)}
  .load{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
  <main class="box" id="box"><div class="load">Carregando ingresso…</div></main>
<script>
  "use strict";
  var SB="https://asppjvxeqpfsonknukla.supabase.co";
  var KEY="sb_publishable_K8nSpB8AP57ZlTIgGI1ANQ_pmNk4o3p";
  var GRUPO="https://chat.whatsapp.com/IsE73l70O8JGES3aNL9tb6";
  var tk=new URLSearchParams(location.search).get("tk")||"";
  var box=document.getElementById("box");

  function fail(msg){ box.innerHTML='<h1>Ingresso</h1><p class="sub">'+msg+'</p>'; }

  if(!tk){ fail("Link inválido."); }
  else {
    fetch(SB+"/functions/v1/ticket-qr?tk="+encodeURIComponent(tk),{headers:{apikey:KEY,Authorization:"Bearer "+KEY}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ fail("Ingresso não encontrado."); return; }
        var used = d.ticket_status==="used";
        box.innerHTML =
          '<div class="badge'+(used?' used':'')+'">'+(used?"✓ já utilizado":"✓ ingresso válido")+'</div>'
          + '<h1>Gang Corre Party</h1>'
          + (d.name?'<div class="name">'+d.name+'</div>':'')
          + '<p class="sub">1 ano da Running Gang · 29.08 · Seu Jorge Boteco</p>'
          + '<div class="qr">'+(d.svg||"")+'</div>'
          + '<div class="info"><b>Como usar:</b> mostre este QR na portaria no dia do evento. Ele vale para <b>1 entrada</b> — não compartilhe.</div>'
          + '<a class="btn" href="'+GRUPO+'" target="_blank" rel="noopener">🔥 Entrar no grupo VIP</a>'
          + '<div class="foot">Guarde este link. Dúvidas? Fale com a Running Gang.</div>';
      })
      .catch(function(){ fail("Não foi possível carregar. Tenta de novo."); });
  }
</script>
</body>
</html>
